<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MDEditor 更新日志 - 查看所有版本的更新内容">
  <title>更新日志 - MDEditor</title>
  <link rel="stylesheet" href="styles.css?v=8">
  <style>
    .changelog-layout {
      display: flex;
      gap: 2rem;
      max-width: var(--wrap);
      margin: 0 auto;
      padding: 2rem;
      min-height: calc(100vh - 60px);
    }

    .changelog-sidebar {
      position: sticky;
      top: 80px;
      width: 200px;
      flex-shrink: 0;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      padding-right: 1rem;
    }

    .changelog-sidebar::-webkit-scrollbar {
      width: 3px;
    }

    .changelog-sidebar::-webkit-scrollbar-thumb {
      background: var(--bg-line);
      border-radius: 3px;
    }

    .sidebar-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-3);
      margin-bottom: 0.75rem;
    }

    .version-list {
      display: flex;
      flex-direction: column;
      gap: 0.125rem;
    }

    .version-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8125rem;
      color: var(--text-2);
      transition: background 0.15s, color 0.15s;
      cursor: pointer;
    }

    .version-link:hover {
      background: rgba(77, 125, 255, 0.08);
      color: var(--text);
    }

    .version-link.is-active {
      background: rgba(77, 125, 255, 0.12);
      color: var(--brand-lit);
    }

    .version-link-date {
      font-size: 0.6875rem;
      color: var(--text-3);
      margin-left: auto;
    }

    .changelog-content {
      flex: 1;
      min-width: 0;
    }

    .changelog-header {
      margin-bottom: 2rem;
    }

    .changelog-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .changelog-header p {
      color: var(--text-2);
      font-size: 0.9375rem;
    }

    .version-section {
      margin-bottom: 2.5rem;
      padding-bottom: 2.5rem;
      border-bottom: 1px solid var(--bg-line);
    }

    .version-section:last-child {
      border-bottom: none;
    }

    .version-heading {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .version-heading h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
    }

    .version-heading .version-date {
      font-size: 0.8125rem;
      color: var(--text-3);
    }

    .change-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .change-item {
      display: flex;
      align-items: flex-start;
      gap: 0.625rem;
      font-size: 0.9rem;
      color: var(--text-2);
      line-height: 1.6;
    }

    .change-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.125rem 0.5rem;
      border-radius: 4px;
      font-size: 0.6875rem;
      font-weight: 500;
      flex-shrink: 0;
      margin-top: 0.2rem;
    }

    .change-tag.tag-new {
      background: rgba(69, 224, 232, 0.12);
      color: var(--cyan);
    }

    .change-tag.tag-fix {
      background: rgba(255, 107, 107, 0.12);
      color: #ff6b6b;
    }

    .change-tag.tag-opt {
      background: rgba(155, 108, 255, 0.12);
      color: var(--violet);
    }

    @media (max-width: 768px) {
      .changelog-layout {
        flex-direction: column;
        padding: 1rem;
      }

      .changelog-sidebar {
        position: static;
        width: 100%;
        max-height: none;
        overflow-y: visible;
        padding-right: 0;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--bg-line);
      }

      .version-list {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.25rem;
      }

      .version-link-date {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html">MDEditor</a>
      <nav class="topbar-nav">
        <a class="nav-tab" href="index.html">首页</a>
        <a class="nav-tab is-active" href="changelog.html">更新日志</a>
      </nav>
      <a class="btn btn-sm" href="index.html#download">下载</a>
    </div>
  </header>

  <main class="changelog-layout">
    <aside class="changelog-sidebar">
      <p class="sidebar-title">版本列表</p>
      <div class="version-list" id="versionList"></div>
    </aside>
    <div class="changelog-content">
      <div class="changelog-header">
        <h1>更新日志</h1>
        <p>MDEditor 的版本更新记录</p>
      </div>
      <div id="changelogEntries"></div>
    </div>
  </main>

  <script>
    (async function () {
      const resp = await fetch('changelog.json');
      const versions = await resp.json();

      const sidebar = document.getElementById('versionList');
      const entries = document.getElementById('changelogEntries');

      // 渲染内容
      versions.forEach(v => {
        const vId = 'v' + v.version.replace(/\./g, '-');

        // 侧边栏链接
        const link = document.createElement('a');
        link.className = 'version-link';
        link.href = `#${vId}`;
        link.innerHTML = `<span>v${v.version}</span><span class="version-link-date">${v.date.slice(5)}</span>`;
        sidebar.appendChild(link);

        // 主内容
        const section = document.createElement('section');
        section.className = 'version-section';
        section.id = vId;

        let changesHtml = '';
        v.changes.forEach(c => {
          let tag = '', text = c;
          if (c.startsWith('新增-')) { tag = '<span class="change-tag tag-new">新增</span>'; text = c.slice(3); }
          else if (c.startsWith('修复-')) { tag = '<span class="change-tag tag-fix">修复</span>'; text = c.slice(3); }
          else if (c.startsWith('优化-')) { tag = '<span class="change-tag tag-opt">优化</span>'; text = c.slice(3); }
          changesHtml += `<div class="change-item">${tag}<span>${text}</span></div>`;
        });

        section.innerHTML = `
          <div class="version-heading">
            <h2>v${v.version}</h2>
            <span class="version-date">${v.date}</span>
          </div>
          <div class="change-list">${changesHtml}</div>
        `;
        entries.appendChild(section);
      });

      // 滚动高亮联动
      const links = sidebar.querySelectorAll('.version-link');
      const sections = entries.querySelectorAll('.version-section');

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            links.forEach(l => l.classList.remove('is-active'));
            const active = sidebar.querySelector(`a[href="#${entry.target.id}"]`);
            if (active) active.classList.add('is-active');
          }
        });
      }, { rootMargin: '-80px 0px -70% 0px' });

      sections.forEach(s => observer.observe(s));

      // 点击平滑滚动
      links.forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();
          const id = link.getAttribute('href').slice(1);
          const target = document.getElementById(id);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });

      // 首个高亮
      if (links[0]) links[0].classList.add('is-active');
    })();
  </script>
</body>
</html>
